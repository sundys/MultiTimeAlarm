name: Build and Release

# 推送 v* 标签自动编译发布 Release；也支持在 Actions 页面手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 从 Secrets 解码 keystore（未配置时跳过，release 包将不签名）
      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
            echo "keystore.jks restored (${SIGNING_KEYSTORE_BASE64} bytes -> file)"
          else
            echo "未配置 secret SIGNING_KEYSTORE_BASE64，release APK 将不签名"
          fi

      - name: Build APKs
        env:
          SIGNING_STORE_FILE: keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Collect artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release_apks
          cp app/build/outputs/apk/debug/app-debug.apk "release_apks/MultiTimeAlarm-${TAG}-debug.apk"
          for f in app/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            if echo "$base" | grep -qi "unsigned"; then
              cp "$f" "release_apks/MultiTimeAlarm-${TAG}-release-unsigned.apk"
            else
              cp "$f" "release_apks/MultiTimeAlarm-${TAG}-release.apk"
            fi
          done
          ls -la release_apks

      # Release 摘要自动取 CHANGELOG.md 最顶部的小节（## vX.Y.Z 下的内容）
      - name: Extract release notes
        run: |
          awk 'BEGIN{f=0} /^## /{if(f) exit; f=1; next} f' CHANGELOG.md > release_notes.md
          echo "----- release notes -----"
          cat release_notes.md

      # 若同名 tag 的 Release 已存在（重发场景），先清空其历史附件。
      # 通过 /releases 列表按 tag_name 过滤（避免 tag 重建瞬间的查询 404），带重试。
      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          get_release_id() {
            curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
              | jq -r "[.[] | select(.tag_name == \"${{ github.ref_name }}\")][0].id // empty"
          }
          RELEASE_ID=""
          for i in 1 2 3; do
            RELEASE_ID=$(get_release_id)
            [ -n "$RELEASE_ID" ] && break
            echo "第 $i 次未找到 Release，5 秒后重试"
            sleep 5
          done
          if [ -z "$RELEASE_ID" ]; then
            echo "无同名 Release，跳过清理"
            exit 0
          fi
          echo "找到已有 Release #$RELEASE_ID，清理旧附件"
          ASSET_IDS=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
            | jq -r '.[].id')
          for asset_id in $ASSET_IDS; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/$asset_id")
            echo "删除附件 #$asset_id -> HTTP $code"
            [ "$code" = "204" ] || { echo "附件删除失败"; exit 1; }
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 多时闹钟 ${{ github.ref_name }}
          body_path: release_notes.md
          files: release_apks/*.apk
          fail_on_unmatched_files: true
