name: Build and Release

# 推送 v* 标签自动编译发布 Release；也支持在 Actions 页面手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 从 Secrets 解码 keystore（未配置时跳过，release 包将不签名）
      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
            echo "keystore.jks restored"
          else
            echo "未配置 secret SIGNING_KEYSTORE_BASE64，release APK 将不签名"
          fi

      - name: Build APKs
        env:
          SIGNING_STORE_FILE: keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # 仅发布 arm64-v8a / armeabi-v7a 正式签名包
      - name: Collect artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release_apks
          for f in app/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              *arm64-v8a*)   abi="arm64-v8a";;
              *armeabi-v7a*) abi="armeabi-v7a";;
              *)             abi="universal";;
            esac
            if echo "$base" | grep -qi "unsigned"; then
              cp "$f" "release_apks/MultiTimeAlarm-${TAG}-${abi}-release-unsigned.apk"
              echo "警告：${abi} 包未签名"
            else
              cp "$f" "release_apks/MultiTimeAlarm-${TAG}-${abi}.apk"
            fi
          done
          ls -la release_apks

      # Release 摘要自动取 CHANGELOG.md 最顶部的小节（## vX.Y.Z 下的内容）
      - name: Extract release notes
        run: |
          awk 'BEGIN{f=0} /^## /{if(f) exit; f=1; next} f' CHANGELOG.md > release_notes.md
          echo "----- release notes -----"
          cat release_notes.md

      # 重发场景：删除已存在的同名 Release（连同旧附件），稍后全新创建，
      # 以确保发布摘要与附件都是最新内容
      - name: Delete stale release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          get_rid() {
            curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
              | jq -r "[.[] | select(.tag_name == \"${{ github.ref_name }}\")][0].id // empty"
          }
          RID=""
          for i in 1 2 3; do
            RID=$(get_rid)
            [ -n "$RID" ] && break
            echo "第 $i 次未找到同名 Release，5 秒后重试"
            sleep 5
          done
          if [ -z "$RID" ]; then
            echo "无同名 Release，跳过删除"
            exit 0
          fi
          echo "删除已有 Release #$RID"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RID")
          echo "HTTP $code"
          [ "$code" = "204" ] || { echo "删除失败"; exit 1; }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 多时闹钟 ${{ github.ref_name }}
          body_path: release_notes.md
          files: release_apks/*.apk
          fail_on_unmatched_files: true
