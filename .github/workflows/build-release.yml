name: Build and Release

# 推送 v* 标签自动编译发布 Release；也支持在 Actions 页面手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Collect artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release_apks
          cp app/build/outputs/apk/debug/app-debug.apk "release_apks/MultiTimeAlarm-${TAG}-debug.apk"
          if ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk "release_apks/MultiTimeAlarm-${TAG}-release-unsigned.apk"
          fi
          ls -la release_apks

      # Release 摘要自动取 CHANGELOG.md 最顶部的小节（## vX.Y.Z 下的内容）
      - name: Extract release notes
        run: |
          awk 'BEGIN{f=0} /^## /{if(f) exit; f=1; next} f' CHANGELOG.md > release_notes.md
          echo "----- release notes -----"
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 多时闹钟 ${{ github.ref_name }}
          body_path: release_notes.md
          files: release_apks/*.apk
          fail_on_unmatched_files: true
